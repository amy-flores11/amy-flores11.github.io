<!DOCTYPE html>
<html>
<head>
  <title>Tecno shop - Acceso</title>
  <link rel="stylesheet" href="../CSS/login.css">
</head>
<body class="body-login">

  <div class="contenedor-auth">
    <div class="tabs-auth">
      <button id="tab-login" class="tab-btn active" onclick="cambiarTab('login')">Iniciar Sesión</button>
      <button id="tab-registro" class="tab-btn" onclick="cambiarTab('registro')">Registrarse</button>
    </div>

    <form id="form-login" class="form-auth active" onsubmit="loginUsuario(event)">
      <h2>Iniciar Sesión</h2>
      <input type="email" id="login-email" placeholder="Correo electrónico" required>
      <input type="password" id="login-pass" placeholder="Contraseña" required>
      <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <form id="form-registro" class="form-auth" onsubmit="registrarUsuario(event)">
      <h2>Crear Cuenta</h2>
      <input type="text" id="reg-nombre" placeholder="Nombre completo" required>
      <input type="email" id="reg-email" placeholder="Correo electrónico" required>
      <input type="password" id="reg-pass" placeholder="Contraseña" required>
      <button type="submit" class="btn-primary">Registrarse</button>
    </form>
  </div>

  <script src="../JS/login.js"></script>
</body>
</html>
